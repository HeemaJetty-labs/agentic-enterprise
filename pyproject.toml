[project]
name = "agentic-enterprise"
version = "0.1.0"
description = "Sovereign Multi-Agent System"
readme = "README.md"
authors = [{ name = "Heema Jetty", email = "heema.ind@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=0.2.0",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.54.0",
]
[tool.uv]
managed = true

[project.scripts]
agentic-enterprise = "agentic_enterprise:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
